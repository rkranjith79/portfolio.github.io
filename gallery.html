  <div class="page-head">

    <h1>Notes by <em>photo</em>.</h1>
    <p class="lead">
      Snapshots from walks, trips, and the occasional coffee. Taped into the
      notebook, captioned like RPF of my own life.
    </p>
  </div>

  <section class="gallery">

    <figure class="polaroid">
      <div class="photo grad-sky"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg></div>
      <figcaption>golden hour on the commute<small>phone camera, 7:12am</small></figcaption>
    </figure>

    <figure class="polaroid">
      <div class="photo grad-ocean"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/></svg></div>
      <figcaption>the sea, being itself<small>weekend trip, no filter</small></figcaption>
    </figure>

    <figure class="polaroid">
      <div class="photo grad-leaf"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg></div>
      <figcaption>the park after rain<small>smells better than screenshots</small></figcaption>
    </figure>

    <figure class="polaroid">
      <div class="photo grad-coffee"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" x2="6" y1="2" y2="4"/><line x1="10" x2="10" y1="2" y2="4"/><line x1="14" x2="14" y1="2" y2="4"/></svg></div>
      <figcaption>the good coffee spot<small>workspace of champions</small></figcaption>
    </figure>

    <figure class="polaroid">
      <div class="photo grad-night"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/><path d="M19 3v4"/><path d="M21 5h-4"/></svg></div>
      <figcaption>city lights on the way back<small>never tired of this</small></figcaption>
    </figure>

    <figure class="polaroid">
      <div class="photo grad-lava"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 3 4 8 5-5 5 15H2L8 3z"/></svg></div>
      <figcaption>the volcano hike<small>worth every step, less every stair</small></figcaption>
    </figure>

    <figure class="polaroid">
      <div class="photo grad-sunset"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 10V2"/><path d="m4.93 10.93 1.41 1.41"/><path d="M20 18h2"/><path d="m19.07 10.93-1.41 1.41"/><path d="M22 22H2"/><path d="m16 6-4 4-4-4"/><path d="M16 18a4 4 0 0 0-8 0"/></svg></div>
      <figcaption>sunset over the bay<small>ran to catch it, caught it</small></figcaption>
    </figure>

    <figure class="polaroid">
      <div class="photo grad-paper"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg></div>
      <figcaption>desk, end of the day<small>the notebook lives here</small></figcaption>
    </figure>

    <figure class="polaroid">
      <div class="photo grad-leaf"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="18.5" r="3.5"/><circle cx="18.5" cy="5.5" r="3.5"/><circle cx="18.5" cy="18.5" r="3.5"/><path d="M12.5 3.5 5.5 18.5"/></svg></div>
      <figcaption>the long ride loop<small>18km, one flat tyre</small></figcaption>
    </figure>

  </section>
